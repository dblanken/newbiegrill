<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GrillTime</title>
  <meta name="description" content="Grill timer with food presets, flip alerts, and multiple simultaneous timers." />
  <meta name="theme-color" content="#1e1b1a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GrillTime" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="alert-banner" class="alert-banner"></div>

  <header class="app-header">
    <h1>🔥 GrillTime</h1>
    <button id="notify-permission-btn" class="btn btn-ghost">Enable Alerts</button>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h2>Active Timers</h2>
        <button id="clear-finished-btn" class="btn btn-ghost" style="display:none">Clear Finished</button>
      </div>
      <p id="active-empty" class="empty-hint">No timers running. Pick a food below to start one.</p>
      <div id="active-list" class="active-list"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Foods</h2>
        <button id="add-custom-btn" class="btn btn-ghost">+ Custom</button>
      </div>
      <div id="preset-groups"></div>
    </section>
  </main>

  <dialog id="custom-food-dialog">
    <form id="custom-food-form" method="dialog">
      <h3>Add Custom Food</h3>
      <label>
        Name
        <input type="text" name="name" required placeholder="e.g. Turkey Legs" />
      </label>
      <label>
        Category
        <select name="category">
          <option value="Meat">Meat</option>
          <option value="Seafood">Seafood</option>
          <option value="Vegetables">Vegetables</option>
          <option value="Fruit">Fruit</option>
        </select>
      </label>
      <label>
        Heat setting
        <input type="text" name="heat" placeholder="e.g. Medium-High" />
      </label>
      <label>
        Total time (minutes)
        <input type="number" name="minutes" min="1" step="0.5" required />
      </label>
      <label>
        Flip times (minutes elapsed, comma separated)
        <input type="text" name="flipMinutes" placeholder="e.g. 5, 10" />
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" onclick="customFoodDialog_cancel()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script>
    function customFoodDialog_cancel() {
      document.getElementById("custom-food-dialog").close();
    }
  </script>
  <script src="js/foods.js"></script>
  <script src="js/timers.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
